<div class="page-header">
  <h1>Books</h1>
  <button mat-flat-button (click)="add()">
    <mat-icon>add</mat-icon>
    Add book
  </button>
</div>

<mat-form-field appearance="outline" class="search">
  <mat-label>Search by title, author or ISBN</mat-label>
  <input matInput [formControl]="search" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (list.page(); as page) {
  <table
    mat-table
    [dataSource]="page.content"
    matSort
    matSortActive="title"
    matSortDirection="asc"
    (matSortChange)="list.changeSort($event)"
  >
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
      <td mat-cell *matCellDef="let book">{{ book.title }}</td>
    </ng-container>

    <ng-container matColumnDef="author">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="author.name">Author</th>
      <td mat-cell *matCellDef="let book">{{ book.authorName }}</td>
    </ng-container>

    <ng-container matColumnDef="isbn">
      <th mat-header-cell *matHeaderCellDef>ISBN</th>
      <td mat-cell *matCellDef="let book">{{ book.isbn }}</td>
    </ng-container>

    <ng-container matColumnDef="publishedYear">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Year</th>
      <td mat-cell *matCellDef="let book">{{ book.publishedYear ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="copies">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="availableCopies">Available</th>
      <td mat-cell *matCellDef="let book" [class.none-left]="book.availableCopies === 0">
        {{ book.availableCopies }} / {{ book.totalCopies }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let book" class="actions">
        <button mat-icon-button aria-label="Edit book" (click)="edit(book)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button aria-label="Delete book" (click)="remove(book)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
    <tr class="mat-mdc-row" *matNoDataRow>
      <td class="mat-mdc-cell empty" [attr.colspan]="columns.length">No books found</td>
    </tr>
  </table>

  <mat-paginator
    [length]="page.page.totalElements"
    [pageIndex]="page.page.number"
    [pageSize]="page.page.size"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="list.changePage($event)"
  />
}
