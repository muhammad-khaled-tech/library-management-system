services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 checks over TCP: the image's first-run init server listens only on the Unix socket,
      # so a socket check can pass before the real server is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
