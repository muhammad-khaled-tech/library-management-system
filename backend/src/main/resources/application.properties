spring.application.name=library-management-system

# Database (defaults match docker-compose.yml; override with env vars)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${DB_USERNAME:library}
spring.datasource.password=${DB_PASSWORD:library}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# The library's time zone decides what "today" is for due dates and late fees
library.time-zone=Africa/Cairo

# Lending rules
library.loan.loan-days=14
library.loan.max-active-loans=3
library.loan.late-fee-per-day=5.00
